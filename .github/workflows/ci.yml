name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install frontend dependencies
        run: python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        working-directory: frontend
        run: python -m unittest discover -s tests -v

      - name: Compile frontend modules
        run: python -m compileall -q frontend/app.py frontend/tests
